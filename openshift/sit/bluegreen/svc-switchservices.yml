apiVersion: v1
kind: Template
parameters:
- name: APPLICATION_NAME
- name: APPLICATION_PIPELINE
- name: TARGET_NAMESPACE
metadata:
  name: ${APPLICATION_NAME}
objects:
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app: ${APPLICATION_NAME}
      hystrix.cluster: ${TARGET_NAMESPACE}
      hystrix.enabled: 'true'
    name: ${APPLICATION_NAME}
  spec:
    ports:
    - name: 8080-tcp
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: 9090-tcp
      port: 9090
      protocol: TCP
      targetPort: 9090
    selector:
      app: ${APPLICATION_NAME}
      deploymentconfig: ${APPLICATION_NAME}-${APPLICATION_PIPELINE}
